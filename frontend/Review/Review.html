<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Movie Rating App</title>
        <meta name="description" content="Login and launch page">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="">
        <link rel="icon" type="image/png" href="/frontend/Assets/Favicon.png">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link href='https://fonts.googleapis.com/css?family=Oswald' rel='stylesheet'>
        <style>
            body {
                font-family: 'Oswald';
                font-size: 22px;
            }
        </style>
    </head>
    <body style="background-color: #9b9b9b">
        <div class="container text-center p-5">
            <div class="row">
                <div class="col">

                </div>
                <div class="col-10 rounded-5 m-auto" style="background-color:#2d232e; color: #f1f0ea">
                    <div>
                        <h4 class="p-4">New Review</h4>
                        <form id="review-form">
                            <div class="mb-3 mx-auto w-50">
                                <label for="movie-name" class="form-label">Movie name</label>
                                <div class = "input-group">
                                    <input type="movie-name" class="form-control w-75" list="movies" id="movie-name" name="movie-name" placeholder="Select a movie, or type one if it isn't here"/>
                                        <datalist id="movies">
                                        </datalist>
                                    <!-- <button id="movie-year" name="movie-year" class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">Year</button>
                                        <ul class="dropdown-menu">
                                            <li><a class="dropdown-item">Action</a></li>
                                            <li><a class="dropdown-item">Another action</a></li>
                                            <li><a class="dropdown-item">Something else here</a></li>
                                        </ul> -->
                                          <select class="form-select w-25" id="movie-year" name="movie-year">
                                            <option selected>Year</option>
                                        </select>
                                </div>
                            </div>
                            <div class="mb-3 mx-auto w-50">
                                <label for="movie-score" class="form-label">Movie score</label>
                                <select class="form-select" aria-label="Default select example" id="movie-score" name="movie-score">
                                    <option selected>Movie Score</option>
                                    <option value="1">1</option>
                                    <option value="2">2</option>
                                    <option value="3">3</option>
                                    <option value="4">4</option>
                                    <option value="5">5</option>
                                </select>
                            </div>
                            <div class="mb-3 mx-auto w-50">
                                <label for="comments" class="form-label">Comments</label>
                                <input type="comments" class="form-control" id="comments" name="comments" placeholder="Your comments...">
                            </div>

                            <button type="submit" class="btn m-2" style="background-color: #534b52; color: #f1f0ea">Submit</button>
                        </form>
                        <button type="button" class="btn m-2" style="background-color: #534b52; color: #f1f0ea" id="home-nav">Home</button>
                        <p></p>
                    </div>
                </div>
                    <div class="col">    
                </div>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <script src="./Review.js"></script>
    </body>
</html>
