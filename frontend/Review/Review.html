<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Welcome to EduFun!</title>
        <meta name="description" content="Login and launch page">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="">
        <link rel="icon" type="image/png" href="/frontend/Assets/Favicon.png">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    </head>
    <body style="font-family: 'Kdam Thmor Pro', sans-serif; background-color: darkgray">
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Kdam+Thmor+Pro&family=VT323&display=swap');
            body {
                font-family: 'Kdam Thmor Pro', sans-serif;
            }
        </style>
        <div class="container text-center p-5" style="font-family: 'Kdam Thmor Pro', sans-serif">
            <div class="row">
                <div class="col">

                </div>
                <div class="col-7 bg-primary-subtle rounded-5" >
                    <div>
                        <h4 class="p-4">New Review</h4>
                        <form id="review-form">
                            <div class="mb-3 mx-auto w-50">
                                <label for="movie-name" class="form-label">Movie name</label>
                                <input type="movie-name" class="form-control" id="movie-name" name="movie-name" placeholder="Movie">
                            </div>
                            <div class="mb-3 mx-auto w-50">
                                <label for="movie-score" class="form-label">Movie score</label>
                                <select class="form-select" aria-label="Default select example">
                                    <option selected>Movie Score</option>
                                    <option value="1">1</option>
                                    <option value="2">2</option>
                                    <option value="3">3</option>
                                    <option value="4">4</option>
                                    <option value="5">5</option>
                                    <option value="6">6</option>
                                    <option value="7">7</option>
                                    <option value="8">8</option>
                                    <option value="9">9</option>
                                    <option value="10">10</option>
                                </select>
                            </div>
                            <div class="mb-3 mx-auto w-50">
                                <label for="comments" class="form-label">Comments</label>
                                <input type="comments" class="form-control" id="comments" name="comments" placeholder="Your comments...">
                            </div>

                            <button type="submit" class="btn btn-primary m-2">Submit</button>
                        </form>
                        <button type="button" class="btn btn-primary" id="home-nav">Home</button>
                        <p></p>
                    </div>
                </div>
                    <div class="col">    
                </div>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <script src="./login.js" async defer></script>
    </body>
</html>
